<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#14275a">
<meta name="description" content="3481 地區第 6 屆扶輪好聲音歌唱比賽：線上報名、資料補登、名次公告與成績查詢。">
<title>扶輪好聲音・3481 地區第 6 屆歌唱比賽</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #14275a; --navy-2: #24407f; --gold: #b8892f; --gold-2: #d9b45f; --gold-soft: #f6ead0;
    --bg: #fbf6ee; --card: #ffffff; --text: #1d2433; --muted: #6a6f7c; --line: #e8dfcf; --soft: #f3ece0;
    --primary: var(--navy); --on-primary: #fff; --ok: #1f7a43; --ok-bg: #e2f3e8; --warn: #8a5a00; --warn-bg: #fdf1d4;
    --err: #b42318; --err-bg: #fde8e6; --hero-from: #fffaf1; --hero-to: #f5e8cf;
    --serif: "Noto Serif TC", "Songti TC", serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --navy: #c9d6ff; --navy-2: #9fb3ec; --gold: #e2bd6a; --gold-2: #e9cc86; --gold-soft: #2c2616;
      --bg: #0d1530; --card: #16214a; --text: #ecefff; --muted: #a2a9c4; --line: #2a3766; --soft: #1f2b58;
      --primary: #e2bd6a; --on-primary: #1a1405; --ok: #57c983; --ok-bg: #12301f; --warn: #f0c96b; --warn-bg: #2f2710;
      --err: #ff8a80; --err-bg: #3a1618; --hero-from: #16214a; --hero-to: #0d1530;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 16px/1.6 "Noto Sans TC", -apple-system, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif; }
  .wrap { max-width: 680px; margin: 0 auto; padding: 16px 16px 120px; }
  .wrap.wide { max-width: 980px; }
  h1 { font-size: 22px; margin: 4px 0 2px; font-family: var(--serif); color: var(--navy); }
  h2 { font-size: 18px; margin: 0 0 12px; font-family: var(--serif); color: var(--navy); }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; margin-bottom: 14px; }
  label { display: block; font-weight: 700; font-size: 14px; margin: 14px 0 6px; }
  .opt { font-weight: 400; color: var(--muted); font-size: 13px; }
  input[type=text], input[type=email], input[type=tel], select, textarea {
    width: 100%; padding: 12px 14px; font: inherit; border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--text); }
  select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 20px) 52%, calc(100% - 15px) 52%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 36px; }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--gold); outline-offset: -1px; }
  textarea { min-height: 76px; resize: vertical; }
  button, .btn { font: inherit; font-weight: 700; border: 0; border-radius: 12px; padding: 12px 18px; cursor: pointer; min-height: 46px;
    background: var(--primary); color: var(--on-primary); text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  button.ghost, .btn.ghost { background: var(--soft); color: var(--text); }
  button.gold, .btn.gold { background: linear-gradient(180deg, var(--gold-2), var(--gold)); color: #1a1405; }
  button.link { background: none; color: var(--navy-2); padding: 8px 4px; min-height: 0; font-weight: 500; }
  button:disabled { opacity: .5; cursor: default; }
  .full { width: 100%; }
  a { color: var(--navy-2); }
  .msg { margin: 12px 0 0; font-weight: 700; font-size: 15px; }
  .msg:empty { display: none; }
  .msg.err { color: var(--err); } .msg.ok { color: var(--ok); }
  .banner { border-radius: 12px; padding: 10px 14px; font-size: 14px; margin-bottom: 12px; background: var(--warn-bg); color: var(--warn); }
  .banner.err { background: var(--err-bg); color: var(--err); }
  .banner.ok { background: var(--ok-bg); color: var(--ok); }
  .chip { display: inline-block; background: var(--soft); border-radius: 999px; padding: 2px 10px; font-size: 13px; white-space: nowrap; }
  .chip.ok { background: var(--ok-bg); color: var(--ok); } .chip.warn { background: var(--warn-bg); color: var(--warn); }
  .chip.err { background: var(--err-bg); color: var(--err); } .chip.gold { background: var(--gold-soft); color: var(--gold); font-weight: 700; }
  .thumb { width: 72px; height: 72px; object-fit: cover; border-radius: 12px; background: var(--soft); flex: none; }
  .row { display: flex; align-items: center; gap: 12px; }
  .grow { flex: 1; min-width: 0; }
  .ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar { height: 8px; background: var(--soft); border-radius: 4px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--gold); }
  .bar.ok > i { background: var(--ok); }
  .tabs { display: flex; gap: 8px; margin: 12px 0; overflow-x: auto; }
  .tabs button { padding: 8px 14px; min-height: 38px; font-size: 14px; white-space: nowrap; }
  .list { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  .item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--line); cursor: pointer; }
  .item:first-child { border-top: 0; }
  .item:active { background: var(--soft); }
  .num { width: 32px; text-align: center; font-weight: 700; color: var(--muted); flex: none; }
  .name { font-weight: 700; }
  .meta { color: var(--muted); font-size: 13px; }
  .small { font-size: 13px; }
  .center { text-align: center; }
  .sticky { position: sticky; top: 0; z-index: 5; background: var(--bg); margin: -16px 0 8px; padding: 16px 0 10px; }
  .nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .nav button { padding: 8px 12px; min-height: 42px; }
  .crit { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 12px 0; border-top: 1px solid var(--line); }
  .crit:first-of-type { border-top: 0; }
  .crit .lab { flex: 1; min-width: 0; font-weight: 700; font-size: 15px; line-height: 1.3; }
  .crit .lab small { display: block; font-weight: 400; color: var(--muted); font-size: 13px; }
  .step { display: flex; align-items: center; gap: 6px; flex: none; }
  .step button { width: 46px; height: 46px; padding: 0; font-size: 22px; line-height: 1; background: var(--soft); color: var(--text); }
  .step input { width: 66px; height: 46px; text-align: center; font-size: 20px; font-weight: 700; padding: 0; }
  .crit .err { color: var(--err); font-size: 13px; flex-basis: 100%; }
  .crit.bad input { border-color: var(--err); }
  .actionbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--card); border-top: 1px solid var(--line);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); }
  .actionbar .in { max-width: 680px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
  .total { font-size: 15px; color: var(--muted); }
  .total b { font-size: 24px; color: var(--text); }
  .toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); background: var(--navy); color: #fff;
    padding: 10px 18px; border-radius: 999px; font-size: 14px; z-index: 20; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .rank { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 18px; background: var(--soft); flex: none; font-family: var(--serif); }
  .rank.top { background: linear-gradient(180deg, var(--gold-2), var(--gold)); color: #1a1405; }
  .stat { font-size: 32px; font-weight: 900; line-height: 1.1; font-family: var(--serif); color: var(--navy); }
  .kv { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 15px; }
  .kv:first-child { border-top: 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
  .back { display: inline-block; margin: 0 0 12px; text-decoration: none; font-size: 15px; }

  /* 首頁主視覺 */
  .hero { position: relative; overflow: hidden; border-radius: 22px; padding: 26px 20px 22px; margin-bottom: 16px; text-align: center;
    background: radial-gradient(120% 90% at 85% 0%, var(--gold-soft) 0%, transparent 60%), linear-gradient(180deg, var(--hero-from), var(--hero-to));
    border: 1px solid var(--line); }
  .hero .notes { position: absolute; inset: 0; pointer-events: none; color: var(--gold-2); opacity: .55; font-size: 28px; }
  .hero .notes span { position: absolute; }
  .org { font-size: 13px; letter-spacing: .08em; color: var(--navy-2); font-weight: 700; }
  .org b { color: var(--gold); }
  .edition { font-family: var(--serif); font-weight: 900; color: var(--navy); font-size: 20px; margin-top: 10px; }
  .title { font-family: var(--serif); font-weight: 900; color: var(--navy); font-size: clamp(40px, 13vw, 64px); line-height: 1.05; margin: 2px 0 10px;
    letter-spacing: .04em; text-shadow: 0 2px 0 var(--gold-soft); }
  .pill { display: inline-block; background: var(--navy); color: #fff; font-family: var(--serif); font-weight: 900; font-size: 20px;
    padding: 4px 22px; border-radius: 999px; letter-spacing: .2em; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .pill { background: var(--gold); color: #1a1405; } }
  .slogan { font-family: var(--serif); color: var(--gold); font-size: 17px; margin: 14px 0 0; letter-spacing: .12em; }
  .deadline { display: inline-flex; align-items: center; gap: 8px; margin-top: 16px; background: var(--card); border: 1px solid var(--gold-2);
    color: var(--text); border-radius: 999px; padding: 6px 14px; font-size: 14px; }
  .deadline b { color: var(--gold); font-family: var(--serif); font-size: 18px; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .actions .btn { min-height: 58px; flex-direction: column; gap: 0; font-size: 16px; padding: 10px; }
  .actions .btn small { font-weight: 400; font-size: 12px; opacity: .85; }
  .actions .wide { grid-column: 1 / -1; }
  .sched { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  @media (max-width: 480px) { .sched { grid-template-columns: 1fr; } }
  .sched .card { margin: 0; border-left: 4px solid var(--gold); border-radius: 0 16px 16px 0; }
  .sched .k { font-family: var(--serif); font-weight: 900; color: var(--navy); font-size: 18px; letter-spacing: .3em; }
  .sched .d { font-weight: 700; margin-top: 2px; }
  .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .fact { background: var(--soft); border-radius: 12px; padding: 10px 12px; }
  .fact .k { font-size: 12px; color: var(--muted); }
  .fact .v { font-weight: 700; }
  .rules h3 { font-family: var(--serif); color: var(--navy); font-size: 16px; margin: 18px 0 6px; padding-left: 10px; border-left: 3px solid var(--gold); }
  .rules h3:first-child { margin-top: 0; }
  .rules p, .rules li { margin: 4px 0; }
  .rules ol, .rules ul { margin: 4px 0; padding-left: 22px; }
  .foot { text-align: center; color: var(--muted); font-size: 13px; margin-top: 24px; line-height: 1.8; }
  .foot a { color: var(--navy-2); }
  .switch { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
  .switch:first-of-type { border-top: 0; }
  .switch button { padding: 8px 14px; min-height: 40px; font-size: 14px; }
  .check { width: 22px; height: 22px; accent-color: var(--gold); flex: none; }
  table.paper { border-collapse: collapse; width: 100%; min-width: 760px; font-size: 14px; }
  table.paper th { text-align: center; font-weight: 700; padding: 8px 6px; border-bottom: 1px solid var(--line); background: var(--soft); line-height: 1.3; }
  table.paper td { padding: 4px 6px; border-top: 1px solid var(--line); text-align: center; }
  table.paper .who { text-align: left; max-width: 180px; position: sticky; left: 0; background: var(--card); }
  table.paper th.who { background: var(--soft); }
  table.paper input { width: 64px; padding: 8px 6px; text-align: center; font-weight: 700; border-radius: 8px; }
  table.paper .cmt input { width: 220px; text-align: left; font-weight: 400; }
  table.paper input.bad { border-color: var(--err); background: var(--err-bg); }
  table.paper tr.changed td { background: var(--warn-bg); }
  table.paper .tot { font-weight: 700; min-width: 56px; }
</style>
</head>
<body>
<div id="app" class="wrap"><p class="sub">載入中…</p></div>
<div id="toast" class="toast"></div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbyT3LbRsFOZVUBKCF418gB8vAc4HpdIK5HcrQs7JlO_YmOHOa02344t8FtQTjGtfF5h/exec';
// 後台單次接收上限約 50MB，檔案編碼後會變大三分之一，所以單檔與單次合計都抓 35MB
const MAX_AUDIO_MB = 35;
const AUDIO_TIP = '建議使用 MP3（一首約 5～12MB）；WAV 等無損格式檔案太大，可能無法上傳';
const TITLE = '扶輪好聲音歌唱比賽';
// 海報上的活動資訊；日期是民國年，倒數用西元時間計算
const EVENT = {
  deadline: new Date('2026-10-23T23:59:59+08:00'), deadlineText: '115 年 10 月 23 日',
  prelim: { date: '115 年 11 月 14 日（六）', place: '中正紀念堂 演藝廳', note: '白色建築物，非國家音樂廳' },
  final: { date: '116 年 2 月 15 日（一）', place: '大直典華五樓 雲翼廳', note: '台北市中山區植福路 8 號' },
};

const app = document.getElementById('app');
const params = new URLSearchParams(location.search);
let cfg = null;

class NetError extends Error {}

async function api(action, payload = {}) {
  let res;
  try {
    res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action, ...payload }) });
  } catch (e) {
    throw new NetError('連線失敗，請檢查網路');
  }
  let data;
  try { data = await res.json(); } catch (e) { throw new NetError('伺服器忙碌，請稍後再試'); }
  if (data.status !== 'success') throw new Error(data.message || '發生錯誤');
  return data;
}

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const thumbUrl = (id, w = 300) => id ? `https://drive.google.com/thumbnail?id=${encodeURIComponent(id)}&sz=w${w}` : '';
const fmt = n => (n === '' || n == null) ? '—' : String(Math.round(Number(n) * 100) / 100);
const $ = sel => app.querySelector(sel);
function setMsg(el, text, kind) { el.textContent = text; el.className = 'msg ' + (kind || ''); }
let toastTimer;
function toast(text) {
  const t = document.getElementById('toast');
  t.textContent = text; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}
function store(key, val) {
  try { if (val === undefined) return JSON.parse(localStorage.getItem(key) || 'null'); localStorage.setItem(key, JSON.stringify(val)); }
  catch (e) { return null; }
}
function head(sub = '') {
  return `<h1>${TITLE}</h1><p class="sub">${esc(sub || (cfg && cfg.stage ? '目前賽程：' + cfg.stage : ''))}</p>`;
}
function backLink() { return `<a class="back" href="#">‹ 回首頁</a>`; }
function pageHead(title, sub = '') { return backLink() + `<h1>${esc(title)}</h1>${sub ? `<p class="sub">${esc(sub)}</p>` : '<div style="height:12px"></div>'}`; }
const anyPub = k => cfg && Object.values(cfg.published).some(p => p[k]);

// =================== 首頁 ===================

// 以台北時間的日曆天計算：截止日當天回傳 0，已過回傳 -1
function daysLeft() {
  if (Date.now() > EVENT.deadline) return -1;
  const day = t => Math.floor((t.getTime() + 8 * 3600000) / 86400000);
  return day(EVENT.deadline) - day(new Date());
}

function renderHome() {
  app.className = 'wrap';
  const left = daysLeft();
  const deadline = !cfg.regOpen ? '報名已截止'
    : left < 0 ? `報名截止日 ${EVENT.deadlineText}` : left === 0 ? '<b>今天</b> 截止報名' : `距離報名截止還有 <b>${left}</b> 天`;
  const acts = [];
  if (cfg.finalsReady && cfg.profileOpen) acts.push(`<a class="btn gold" href="#final">決賽選手專區<small>填寫決賽曲目、上傳決賽音檔</small></a>`);
  if (cfg.regOpen) acts.push(`<a class="btn gold ${cfg.profileOpen ? '' : 'wide'}" href="#register">我要報名<small>新參賽者</small></a>`);
  if (cfg.profileOpen) acts.push(`<a class="btn ${cfg.regOpen ? '' : 'wide'}" href="#profile">補填／修改資料<small>已報名者</small></a>`);
  if (anyPub('ranks')) acts.push(`<a class="btn ghost" href="#ranks">名次公告<small>不用登入</small></a>`);
  if (anyPub('detail')) acts.push(`<a class="btn ghost" href="#me">查詢我的成績<small>分數與評語</small></a>`);
  // 決賽專區獨佔一列；其餘按鈕兩兩一列，落單的撐滿
  if (cfg.finalsReady && cfg.profileOpen) acts[0] = acts[0].replace('class="btn ', 'class="btn wide ');
  const rest = acts.length - (cfg.finalsReady && cfg.profileOpen ? 1 : 0);
  if (rest % 2 === 1 && rest > 1) acts[acts.length - 1] = acts[acts.length - 1].replace('class="btn ', 'class="btn wide ');
  app.innerHTML = `
    <section class="hero">
      <div class="notes" aria-hidden="true"><span style="left:6%;top:14%">♪</span><span style="right:5%;top:6%;font-size:30px">♫</span><span style="left:12%;bottom:18%;font-size:22px">♩</span><span style="right:16%;bottom:12%">♪</span></div>
      <div class="org">Rotary <b>·</b> District 3481</div>
      <div class="edition">3481 地區第 6 屆</div>
      <div class="title">扶輪好聲音</div>
      <span class="pill">歌唱比賽</span>
      <p class="slogan">用歌聲傳遞感動・用旋律創造影響</p>
      <div class="deadline">${deadline}</div>
    </section>
    ${acts.length ? `<div class="actions">${acts.join('')}</div>` : ''}
    <div class="sched">
      <div class="card"><div class="k">初賽</div><div class="d">${EVENT.prelim.date}</div><div>${EVENT.prelim.place}</div><div class="meta">${EVENT.prelim.note}</div></div>
      <div class="card"><div class="k">決賽</div><div class="d">${EVENT.final.date}</div><div>${EVENT.final.place}</div><div class="meta">${EVENT.final.note}</div></div>
    </div>
    <div class="card">
      <h2>比賽重點</h2>
      <div class="facts">
        <div class="fact"><div class="k">參賽資格</div><div class="v">3481 地區社友、寶眷、尊眷、執秘</div></div>
        <div class="fact"><div class="k">報名費</div><div class="v">3,000 元／每位</div></div>
        <div class="fact"><div class="k">曲目語言</div><div class="v">英、日、國、台語</div></div>
        <div class="fact"><div class="k">名額</div><div class="v">共 70 組・決賽錄取 30 位</div></div>
      </div>
      <p style="margin:14px 0 0"><a href="#rules">閱讀完整比賽辦法 ›</a></p>
    </div>
    ${footer()}`;
}

function footer() {
  return `<div class="foot">活動洽詢：地區辦公室 <a href="tel:0227005978">02 2700 5978</a><br>主辦單位保有活動最終解釋權</div>`;
}

function renderRules() {
  app.className = 'wrap';
  app.innerHTML = pageHead('比賽辦法', '3481 地區第 6 屆扶輪好聲音歌唱比賽') + `
    <div class="card rules">
      <h3>比賽日期與地點</h3>
      <p><b>初賽</b>：${EVENT.prelim.date}，${EVENT.prelim.place}（${EVENT.prelim.note}）</p>
      <p><b>決賽</b>：${EVENT.final.date}，${EVENT.final.place}（${EVENT.final.note}）</p>
      <h3>參賽資格</h3>
      <p>3481 地區社友、寶眷（社友夫人）、尊眷（社友先生）、執秘為限。</p>
      <h3>報名費</h3>
      <p>每位 3,000 元。</p>
      <h3>曲目</h3>
      <p>以英語、日語、國語、台語歌曲為限。</p>
      <h3>報名截止</h3>
      <p>${EVENT.deadlineText}截止報名，共 70 組。</p>

async function renderRanks(pick) {
  app.className = 'wrap';
  app.innerHTML = pageHead('名次公告') + '<p class="sub">載入中…</p>';
  try {
    const r = await api('ranks');
    if (!r.stages.length) { app.innerHTML = pageHead('名次公告') + '<div class="card center">名次尚未公布</div>'; return; }
    const cur = r.stages.find(s => s.stage === pick) || r.stages[0];
    app.innerHTML = pageHead('名次公告') + (r.stages.length > 1 ? `<div class="tabs">${r.stages.map(s =>
      `<button class="${s === cur ? '' : 'ghost'}" data-s="${esc(s.stage)}">${esc(s.stage)}</button>`).join('')}</div>` : `<p class="sub">${esc(cur.stage)}</p>`)
      + (cur.list.length ? `<div class="list">${cur.list.map(x => `
        <div class="item" style="cursor:default"><div class="rank ${x.rank <= 3 ? 'top' : ''}">${x.rank}</div>
          <div class="grow"><div class="name">${esc(x.singers)} ${x.advanced ? '<span class="chip gold">晉級決賽</span>' : ''}</div><div class="meta">${esc(x.club)}${x.song ? '・' + esc(x.song) : ''}</div></div></div>`).join('')}</div>`

      if ((audio ? audio.size : 0) + (finalAudio ? finalAudio.size : 0) > MAX_AUDIO_MB * MB) throw new Error(`兩個音檔合計超過 ${MAX_AUDIO_MB}MB，請分兩次上傳：先選一個儲存，再選另一個儲存`);

      setMsg(m, isNew ? '送出中，請稍候…' : '上傳中，請稍候…');
      const r = await api('save', payload);

      window.scrollTo(0, 0);
    } catch (err) { setMsg(m, err.message, 'err'); save.disabled = false; }

function readDataUrl(file) {
  return new Promise((ok, fail) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = () => fail(new Error('讀取檔案失敗')); r.readAsDataURL(file); });
}

async function shrinkImage(file) {
  const url = await readDataUrl(file);
  const img = await new Promise((ok, fail) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => fail(new Error('無法讀取這張照片，請換一張')); i.src = url; });
  const scale = Math.min(1, 1600 / Math.max(img.width, img.height));
  const c = document.createElement('canvas');
  c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return { name: file.name.replace(/\.[^.]+$/, '') + '.jpg', data: c.toDataURL('image/jpeg', 0.85) };
}

const jKey = () => 'sing:judge:' + J.jt;

async function startJudge(jt) {
  J.jt = jt;
  const saved = store(jKey()) || {};
  J.outbox = saved.outbox || {};
  app.className = 'wrap';
  app.innerHTML = head('評審評分') + '<p class="sub">載入中…</p>';
  try {
    J.data = await api('judge', { jt });
    // 賽別切換後，舊賽別未送出的分數不能送到新賽別
    if (saved.data && saved.data.stage !== J.data.stage) J.outbox = {};
    store(jKey(), { outbox: J.outbox, data: J.data });
  } catch (err) {
    if (err instanceof NetError && saved.data) { J.data = saved.data; J.lastError = '目前離線，顯示上次載入的名單'; }
    else { app.innerHTML = head('評審評分') + `<div class="banner err">${esc(err.message)}</div>`; return; }
  }
  window.addEventListener('online', flushOutbox);
  window.addEventListener('beforeunload', e => { if (J.dirty || Object.keys(J.outbox).length) { e.preventDefault(); e.returnValue = ''; } });
  window.addEventListener('hashchange', judgeRoute);
  setInterval(flushOutbox, 15000);
  flushOutbox();
  judgeRoute();
}

function judgeRoute() {
  const id = decodeURIComponent(location.hash.slice(1));
  const i = J.data.entries.findIndex(e => e.id === id);
  if (i >= 0) { J.idx = i; drawScore(); } else drawList();
}

function go(hash) {
  if (J.dirty && !confirm('這位的分數還沒儲存，確定要離開嗎？')) return false;
  J.dirty = false;
  if (location.hash === hash || (hash === '#' && !location.hash)) judgeRoute(); else location.hash = hash;
  return true;
}

function entryState(e) {
  if (J.outbox[e.id]) return 'pending';
  return e.score ? 'done' : 'todo';
}

function shownScore(e) {
  const p = J.outbox[e.id];
  if (p) return { items: p.items, comment: p.comment, total: sumItems(p.items) };
  return e.score;
}

function sumItems(items) { return Math.round(J.data.criteria.reduce((s, c) => s + (Number(items[c.name]) || 0), 0) * 100) / 100; }

function statusLine() {
  const n = Object.keys(J.outbox).length;
  if (J.lastError && n) return `<div class="banner err">${n} 筆分數尚未送出：${esc(J.lastError)}<br><button class="link" id="retry" style="padding:4px 0">立即重試</button></div>`;
  if (n) return `<div class="banner">${n} 筆分數傳送中…</div>`;
  if (J.lastError) return `<div class="banner">${esc(J.lastError)}</div>`;
  return '';
}

function bindRetry() { const r = $('#retry'); if (r) r.onclick = () => { J.lastError = ''; flushOutbox(); }; }

function drawList() {
  window.scrollTo(0, 0);
  const d = J.data, list = d.entries;
  const done = list.filter(e => entryState(e) !== 'todo').length;
  const counts = { all: list.length, todo: list.length - done, done };
  const shown = list.map((e, i) => [e, i]).filter(([e]) => J.filter === 'all' || (J.filter === 'todo') === (entryState(e) === 'todo'));
  const firstTodo = list.findIndex(e => entryState(e) === 'todo');
  app.className = 'wrap';
  app.innerHTML = `
    <div class="sticky">
      <div class="row"><div class="grow"><h1 style="margin:0">評審：${esc(d.judge)}</h1><div class="meta"><span class="chip gold">${esc(d.stage)}</span>　已評 ${done} / ${list.length}</div></div></div>
      <div class="bar ${done === list.length ? 'ok' : ''}" style="margin-top:10px"><i style="width:${list.length ? done / list.length * 100 : 0}%"></i></div>
    </div>
    ${d.scoringOpen ? '' : '<div class="banner err">評分已關閉，只能查看，無法修改分數。</div>'}
    ${statusLine()}
    ${firstTodo >= 0 && d.scoringOpen ? `<button class="full gold" id="next" style="margin-bottom:4px">從第 ${firstTodo + 1} 位（${esc(list[firstTodo].singers)}）開始評分</button>` : ''}
    ${done === list.length && list.length ? '<div class="banner ok">全部評完了，辛苦了。點任何一位可以修改分數。</div>' : ''}
    <div class="tabs">
      ${[['all', '全部'], ['todo', '未評'], ['done', '已評']].map(([k, t]) => `<button class="${J.filter === k ? '' : 'ghost'}" data-f="${k}">${t} ${counts[k]}</button>`).join('')}
    </div>
    <div class="list">${shown.length ? shown.map(([e, i]) => {
      const st = entryState(e), sc = shownScore(e);
      const badge = st === 'todo' ? '<span class="chip">未評</span>' : st === 'pending' ? `<span class="chip warn">${fmt(sc.total)} 傳送中</span>` : `<span class="chip ok">${fmt(sc.total)}</span>`;
      return `<div class="item" data-id="${esc(e.id)}"><div class="num">${e.order !== '' ? esc(e.order) : i + 1}</div>
        <div class="grow"><div class="name ellipsis">${esc(e.singers)}</div><div class="meta ellipsis">${esc(e.club)}・${esc(e.song || '曲目未定')}</div></div>${badge}</div>`;
    }).join('') : '<div class="item" style="cursor:default"><span class="meta">這個分類沒有參賽者</span></div>'}</div>`;
  app.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { J.filter = b.dataset.f; drawList(); });
  app.querySelectorAll('[data-id]').forEach(el => el.onclick = () => go('#' + encodeURIComponent(el.dataset.id)));
  const nx = $('#next'); if (nx) nx.onclick = () => go('#' + encodeURIComponent(list[firstTodo].id));
  bindRetry();
}

function drawScore() {
  window.scrollTo(0, 0);
  const d = J.data, list = d.entries, e = list[J.idx], sc = shownScore(e) || { items: {}, comment: '' };
  const ro = !d.scoringOpen;
  const isLast = J.idx === list.length - 1;
  J.dirty = false;
  app.className = 'wrap';
  app.innerHTML = `
    <div class="sticky">
      <div class="nav">
        <button class="ghost" id="toList">‹ 名單</button>
        <span class="meta"><span class="chip gold">${esc(d.stage)}</span> ${J.idx + 1} / ${list.length}</span>
        <span><button class="ghost" id="prev" ${J.idx === 0 ? 'disabled' : ''} aria-label="上一位">‹</button>
        <button class="ghost" id="nextP" ${isLast ? 'disabled' : ''} aria-label="下一位">›</button></span>
      </div>
    </div>
    ${ro ? '<div class="banner err">評分已關閉，只能查看。</div>' : ''}
    <div id="status">${statusLine()}</div>
    <div class="card">
      <div class="row">
        <div style="display:flex;flex-direction:column;gap:6px;flex:none">
          ${e.photoId ? `<img class="thumb" src="${thumbUrl(e.photoId)}" alt="">` : '<div class="thumb"></div>'}
          ${e.photo2Id ? `<img class="thumb" src="${thumbUrl(e.photo2Id)}" alt="">` : ''}
        </div>
        <div class="grow">
          <div class="meta">${e.order !== '' ? '出場 ' + esc(e.order) + '・' : ''}${esc(e.id)}・${esc(e.club)}</div>
          <div class="name" style="font-size:20px;line-height:1.3;font-family:var(--serif)">${esc(e.singers)}</div>
          <div>${esc(e.song || '曲目未定')}${e.artist ? ' <span class="meta">／' + esc(e.artist) + '</span>' : ''}${e.lang ? ' <span class="chip">' + esc(e.lang) + '</span>' : ''}</div>
          ${e.audio ? `<a class="small" href="${esc(e.audio)}" target="_blank" rel="noopener">開啟音檔</a>` : ''}
        </div>
      </div>
    </div>
    <form id="sf" class="card" novalidate>
      ${d.criteria.map((c, k) => `
        <div class="crit" data-k="${k}">
          <div class="lab">${esc(c.name)}<small>滿分 ${c.max}${c.note ? '・' + esc(c.note) : ''}</small></div>
          <div class="step">
            <button type="button" data-d="-1" aria-label="${esc(c.name)}減 0.5" ${ro ? 'disabled' : ''}>−</button>
            <input type="text" inputmode="decimal" name="c${k}" aria-label="${esc(c.name)}分數" placeholder="—" ${ro ? 'readonly' : ''}
              value="${sc.items[c.name] === '' || sc.items[c.name] == null ? '' : esc(sc.items[c.name])}">
            <button type="button" data-d="1" aria-label="${esc(c.name)}加 0.5" ${ro ? 'disabled' : ''}>＋</button>
          </div>
          <div class="err"></div>
        </div>`).join('')}
      <label for="cm" style="margin-top:10px">評語 <span class="opt">選填・公布後選手看得到</span></label>
      <textarea id="cm" ${ro ? 'readonly' : ''} placeholder="給選手的建議">${esc(sc.comment || '')}</textarea>
    </form>
    <div class="actionbar"><div class="in">
      <div class="total grow">總分 <b id="tot">—</b> / ${d.criteria.reduce((s, c) => s + c.max, 0)}</div>
      ${ro ? '' : `<button class="gold" id="save">${isLast ? '儲存' : '儲存，下一位'}</button>`}
    </div></div>`;

  const form = $('#sf');
  const inputs = d.criteria.map((c, k) => form.elements['c' + k]);
  const parse = v => { v = String(v).trim(); return v === '' ? null : Number(v); };
  const check = k => {
    const c = d.criteria[k], v = parse(inputs[k].value), box = form.querySelector(`[data-k="${k}"]`);
    let err = '';
    if (v === null) err = '';
    else if (isNaN(v) || v < 0 || v > c.max) err = `請填 0 到 ${c.max}`;
    else if (Math.round(v * 2) !== v * 2) err = '最小單位是 0.5';
    box.classList.toggle('bad', !!err); box.querySelector('.err').textContent = err;
    return !err;
  };
  const refresh = () => {
    const vals = inputs.map(i => parse(i.value));
    $('#tot').textContent = vals.some(v => v === null || isNaN(v)) ? (vals.every(v => v === null) ? '—' : fmt(vals.reduce((s, v) => s + (Number(v) || 0), 0)) + '…') : fmt(vals.reduce((s, v) => s + v, 0));
  };
  inputs.forEach((inp, k) => {
    inp.oninput = () => { J.dirty = true; check(k); refresh(); };
    inp.onfocus = () => inp.select();
  });
  form.querySelectorAll('[data-d]').forEach(b => b.onclick = () => {
    const k = Number(b.closest('.crit').dataset.k), c = d.criteria[k], inp = inputs[k];
    let v = parse(inp.value);
    // 空白時從滿分 7 成開始，避免從 0 一路按上去
    if (v === null || isNaN(v)) v = Math.round(c.max * 0.7 * 2) / 2;
    else v = Math.min(c.max, Math.max(0, Math.round((v + Number(b.dataset.d) * 0.5) * 2) / 2));
    inp.value = v; J.dirty = true; check(k); refresh();
  });
  $('#cm').oninput = () => { J.dirty = true; };
  refresh();

  $('#toList').onclick = () => go('#');
  $('#prev').onclick = () => J.idx > 0 && go('#' + encodeURIComponent(list[J.idx - 1].id));
  $('#nextP').onclick = () => !isLast && go('#' + encodeURIComponent(list[J.idx + 1].id));
  bindRetry();

  const save = $('#save');
  if (save) save.onclick = () => {
    let ok = true, firstBad = null;
    inputs.forEach((inp, k) => {
      const box = form.querySelector(`[data-k="${k}"]`);
      if (parse(inp.value) === null) { box.classList.add('bad'); box.querySelector('.err').textContent = '請填分數'; ok = false; }
      else if (!check(k)) ok = false;
      if (!ok && firstBad === null) firstBad = inp;
    });
    if (!ok) { firstBad.focus(); return; }
    const items = {};
    d.criteria.forEach((c, k) => items[c.name] = parse(inputs[k].value));
    J.outbox[e.id] = { items, comment: $('#cm').value.trim(), ts: Date.now() };
    store(jKey(), { outbox: J.outbox, data: J.data });
    J.dirty = false;
    toast(`${e.singers} 總分 ${fmt(sumItems(items))} 已儲存`);
    flushOutbox();
    if (isLast) go('#'); else go('#' + encodeURIComponent(list[J.idx + 1].id));
  };
}

async function flushOutbox() {
  if (J.flushing || !J.data) return;
  const ids = Object.keys(J.outbox);
  if (!ids.length) return;
  J.flushing = true;
  try {
    for (const id of ids) {
      const p = J.outbox[id];
      try {
        const r = await api('score', { jt: J.jt, stage: J.data.stage, id, items: p.items, comment: p.comment });
        const e = J.data.entries.find(x => x.id === id);
        if (e) e.score = { items: p.items, comment: p.comment, total: r.total };
        if (J.outbox[id] && J.outbox[id].ts === p.ts) delete J.outbox[id];
        J.lastError = '';
      } catch (err) {
        J.lastError = err.message;
        if (err instanceof NetError) break;
      }
    }
  } finally {
    J.flushing = false;
    store(jKey(), { outbox: J.outbox, data: J.data });
    // 名單頁直接重畫；評分頁只更新狀態列，避免打斷正在輸入的評審
    const st = $('#status');
    if (st) { st.innerHTML = statusLine(); bindRetry(); } else if (!J.dirty) judgeRoute();
  }
}

// =================== 主辦 ===================

const A = { at: '', data: null, timer: null, tab: 'rank', picks: null };

async function startAdmin(at) {
  A.at = at;
  app.className = 'wrap wide';
  app.innerHTML = head('主辦管理') + '<p class="sub">載入中…</p>';
  await loadAdmin();
  A.timer = setInterval(() => { if (A.tab === 'rank') loadAdmin(); }, 30000);
  window.addEventListener('beforeunload', e => { if (A.tab === 'paper' && paperDirty()) { e.preventDefault(); e.returnValue = ''; } });
}

async function loadAdmin() {
  try {
    A.data = await api('admin', { at: A.at });
    A.data.loadedAt = new Date();
    A.err = '';
  } catch (err) {
    A.err = err.message;
    if (!A.data) { app.innerHTML = head('主辦管理') + `<div class="banner err">${esc(err.message)}</div>`; clearInterval(A.timer); return; }
  }
  drawAdmin();
}

async function adminCall(action, payload, okText) {
  const sm = $('#sm');
  app.querySelectorAll('[data-act]').forEach(b => b.disabled = true);
  if (sm) setMsg(sm, '更新中…');
  try {
    A.data = await api(action, { at: A.at, ...payload });
    A.data.loadedAt = new Date();
    A.picks = null;
    drawAdmin();
    toast(okText || '已更新');
  } catch (err) {
    if (sm) setMsg(sm, err.message, 'err');
    app.querySelectorAll('[data-act]').forEach(b => b.disabled = false);
  }
}

function drawAdmin() {
  const d = A.data, t = d.loadedAt;
  const time = [t.getHours(), t.getMinutes(), t.getSeconds()].map(n => String(n).padStart(2, '0')).join(':');
  const tabs = [['rank', `${d.stage}名次`], ['paper', '紙本輸入'], ['advance', '晉級決賽'], ['settings', '賽程與開關']];
  app.innerHTML = `
    <h1>主辦管理</h1>
    <p class="sub"><span class="chip gold">目前賽程：${esc(d.stage)}</span>　報名 ${d.registered} / 70 組・最後更新 ${time}
      <button class="link" id="reload">立即更新</button></p>
    ${A.err ? `<div class="banner err">更新失敗：${esc(A.err)}</div>` : ''}
    <div class="tabs">${tabs.map(([k, l]) => `<button class="${A.tab === k ? '' : 'ghost'}" data-tab="${k}">${l}</button>`).join('')}</div>
    <div id="tabBody"></div>`;
  $('#reload').onclick = loadAdmin;
  app.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => {
    if (A.tab === 'paper' && b.dataset.tab !== 'paper' && paperDirty() && !confirm('紙本輸入還有尚未儲存的分數，確定要離開嗎？')) return;
    if (b.dataset.tab === 'paper') P.data = null;
    A.tab = b.dataset.tab; drawAdmin();
  });
  const body = $('#tabBody');
  if (A.tab === 'rank') drawAdminRank(body);
  else if (A.tab === 'advance') drawAdminAdvance(body);
  else if (A.tab === 'paper') drawAdminPaper(body);
  else drawAdminSettings(body);
}

function drawAdminRank(body) {
  const d = A.data, total = d.total;
  const allDone = d.judges.every(j => j.done === total);
  const ranked = d.results.filter(r => r.rank !== '').sort((a, b) => a.rank - b.rank);
  const unranked = d.results.filter(r => r.rank === '');
  const pubKey = d.stage + '公布名次', detKey = d.stage + '公布評分細節';
  body.innerHTML = `
    <div class="card">
      <div class="switch">
        <div class="grow small">${d.switches['開放評分'] ? '評分開放中，評審可以修改分數。每 30 秒自動更新名次。' : '評分已鎖定，評審只能查看。'}</div>
        <button data-act data-key="開放評分" data-on="${d.switches['開放評分'] ? 0 : 1}" class="${d.switches['開放評分'] ? 'ghost' : ''}">${d.switches['開放評分'] ? '鎖定評分' : '開放評分'}</button>
      </div>
      <div class="switch">
        <div class="grow small">${d.switches[pubKey] ? `${d.stage}名次已公布。` : `${d.stage}名次未公布，只有你看得到。`}</div>
        <button data-act data-key="${pubKey}" data-on="${d.switches[pubKey] ? 0 : 1}" class="${d.switches[pubKey] ? 'ghost' : 'gold'}">${d.switches[pubKey] ? '取消公布名次' : '公布名次'}</button>
      </div>
      <div class="switch">
        <div class="grow small">${d.switches[detKey] ? `${d.stage}評分細節已公布，選手可用 Email 查詢。` : `${d.stage}評分細節未公布。`}</div>
        <button data-act data-key="${detKey}" data-on="${d.switches[detKey] ? 0 : 1}" class="${d.switches[detKey] ? 'ghost' : 'gold'}">${d.switches[detKey] ? '取消公布細節' : '公布細節'}</button>
      </div>
      <p class="msg" id="sm"></p>
    </div>
    <div class="card" style="padding:12px 16px">
      <div class="row" style="flex-wrap:wrap;gap:6px 14px">
        <span class="small" style="font-weight:700">評審進度</span>
        ${d.judges.map(j => `<span class="small">${esc(j.name)} <span class="chip ${j.done === total ? 'ok' : 'warn'}">${j.done}/${total}</span></span>`).join('')}
      </div>
      ${allDone ? '' : '<p class="meta small" style="margin:6px 0 0">還有評審沒評完，下面的名次會繼續變動。</p>'}
    </div>
    ${ranked.some(r => r.tie) ? '<div class="banner err">有參賽者四項平均完全相同，名次並列，請現場決定如何處理。</div>' : ''}
    <div class="list">${ranked.map(r => `
      <div class="item" style="cursor:default;align-items:flex-start">
        <div class="rank ${r.rank <= 3 ? 'top' : ''}">${r.rank}</div>
        <div class="grow">
          <div class="row" style="gap:8px;flex-wrap:wrap"><span class="name">${esc(r.singers)}</span>${r.tie ? '<span class="chip err">同分</span>' : ''}${r.judges < d.judges.length ? `<span class="chip warn">${r.judges}/${d.judges.length} 位評審</span>` : ''}</div>
          <div class="meta">${r.order !== '' ? '出場 ' + esc(r.order) + '・' : ''}${esc(r.club)}・${esc(r.song || '')}</div>
          <div class="meta small">${d.criteria.map(c => `${esc(c.name.split('／')[0])} ${fmt(r.items[c.name])}`).join('・')}</div>
        </div>
        <div style="text-align:right"><div class="stat" style="font-size:24px">${fmt(r.total)}</div><div class="meta small">總分</div></div>
      </div>`).join('') || '<div class="item" style="cursor:default"><span class="meta">還沒有任何評分</span></div>'}</div>
    ${unranked.length ? `<p class="meta" style="margin-top:12px">尚未有評分：${unranked.map(r => esc(r.singers)).join('、')}</p>` : ''}`;
  bindSwitches(body);
}

const SWITCH_TEXT = {
  開放評分: ['重新開放評分？評審可以再修改分數，名次可能會變動。', '鎖定評分？評審將無法再修改分數。'],
  開放報名: ['開放報名？首頁會出現「我要報名」。', '關閉報名？首頁不再顯示「我要報名」。'],
  開放補資料: ['開放補資料？已報名的人可以登入修改資料。', '關閉補資料？參賽者將無法再修改資料。'],
};
function switchConfirm(key, on) {
  if (SWITCH_TEXT[key]) return SWITCH_TEXT[key][on ? 0 : 1];
  const stage = key.slice(0, 2), what = key.includes('名次') ? '名次' : '評分細節';
  const lock = stage === A.data.stage ? '，同時會鎖定評分' : '';
  return on ? `公布${stage}${what}？${what === '名次' ? '所有人都能在首頁看到名次列表' : '選手可以用 Email 查到自己的分數與評語'}${lock}。` : `取消公布${stage}${what}？`;
}
function bindSwitches(body) {
  body.querySelectorAll('[data-key]').forEach(b => b.onclick = () => {
    const on = b.dataset.on === '1';
    if (confirm(switchConfirm(b.dataset.key, on))) adminCall('adminSet', { key: b.dataset.key, value: on });
  });
}

function drawAdminAdvance(body) {
  const d = A.data;
  if (!A.picks) A.picks = new Set(d.advance.filter(x => x.advanced).map(x => x.id));
  const count = () => A.picks.size;
  const saved = new Set(d.advance.filter(x => x.advanced).map(x => x.id));
  const changed = () => count() !== saved.size || [...A.picks].some(id => !saved.has(id));
  body.innerHTML = `
    <div class="card">
      <div class="row"><div class="grow"><div class="name">晉級決賽名單</div><div class="meta">依初賽名次排列，逐一勾選晉級者。名額 ${d.quota} 位。</div></div>
      <span class="chip ${count() === d.quota ? 'ok' : 'warn'}" id="cnt">已勾選 ${count()} / ${d.quota}</span></div>
      <p class="meta small" style="margin:8px 0 0">晉級者登入「補填／修改資料」後會看到決賽曲目欄位。也可以直接在 Sheet「報名」表的「晉級決賽」欄填「是」。</p>
    </div>
    <div class="list">${d.advance.map(x => `
      <label class="item" style="margin:0;font-weight:400">
        <input type="checkbox" class="check" data-id="${esc(x.id)}" ${A.picks.has(x.id) ? 'checked' : ''}>
        <div class="rank ${x.rank !== '' && x.rank <= 3 ? 'top' : ''}" style="width:38px;height:38px;font-size:15px">${x.rank === '' ? '—' : x.rank}</div>
        <div class="grow"><div class="name ellipsis">${esc(x.singers)}</div><div class="meta">${esc(x.id)}・${esc(x.club)}</div></div>
        <div class="meta">${fmt(x.total)}</div>
      </label>`).join('')}</div>
    <div class="actionbar"><div class="in" style="max-width:980px">
      <div class="grow small" id="hint">${changed() ? '有尚未儲存的變更' : '名單已是最新'}</div>
      <button class="gold" data-act id="saveAdv">儲存晉級名單</button>
    </div></div>
    <p class="msg" id="sm"></p>`;
  body.querySelectorAll('input[data-id]').forEach(cb => cb.onchange = () => {
    if (cb.checked) A.picks.add(cb.dataset.id); else A.picks.delete(cb.dataset.id);
    const c = $('#cnt'); c.textContent = `已勾選 ${count()} / ${d.quota}`; c.className = 'chip ' + (count() === d.quota ? 'ok' : 'warn');
    $('#hint').textContent = changed() ? '有尚未儲存的變更' : '名單已是最新';
  });
  $('#saveAdv').onclick = () => {
    const n = count();
    const warn = n !== d.quota ? `\n注意：勾選 ${n} 位，和名額 ${d.quota} 位不同。` : '';
    if (confirm(`儲存晉級名單，共 ${n} 位？${warn}`)) adminCall('adminAdvance', { ids: [...A.picks] }, '晉級名單已儲存');
  };
}

function drawAdminSettings(body) {
  const d = A.data, sw = d.switches;
  const row = (key, onText, offText, onBtn, offBtn) => `<div class="switch">
    <span class="chip ${sw[key] ? 'ok' : ''}">${sw[key] ? '開' : '關'}</span>
    <div class="grow small">${sw[key] ? onText : offText}</div>
    <button data-act data-key="${key}" data-on="${sw[key] ? 0 : 1}" class="${sw[key] ? 'ghost' : ''}">${sw[key] ? offBtn : onBtn}</button></div>`;
  const next = d.stages.find(s => s !== d.stage);
  body.innerHTML = `
    <div class="card">
      <h2>目前賽程：${esc(d.stage)}</h2>
      <p class="meta" style="margin:0 0 12px">評審頁會依目前賽程顯示名單。切換到決賽後，評審只會看到勾選晉級的人，曲目改為決賽曲目；初賽分數會保留。</p>
      <button data-act id="stageBtn" class="${next === '決賽' ? 'gold' : 'ghost'}">切換到${esc(next)}</button>
    </div>
    <div class="card">
      <h2>報名與資料</h2>
      ${row('開放報名', '首頁顯示「我要報名」。', '報名已關閉。', '開放報名', '關閉報名')}
      ${row('開放補資料', '參賽者可以登入補填或修改資料。', '補資料已關閉。', '開放補資料', '關閉補資料')}
    </div>
    <div class="card">
      <h2>評分與公布</h2>
      ${row('開放評分', '評審可以評分與修改分數。', '評分已鎖定。', '開放評分', '鎖定評分')}
      ${d.stages.map(st => row(st + '公布名次', `${st}名次已公布。`, `${st}名次未公布。`, `公布${st}名次`, '取消公布')
        + row(st + '公布評分細節', `${st}評分細節已公布。`, `${st}評分細節未公布。`, `公布${st}細節`, '取消公布')).join('')}
      <p class="msg" id="sm"></p>
    </div>`;
  bindSwitches(body);
  $('#stageBtn').onclick = () => {
    const msg = next === '決賽'
      ? `切換到決賽？評審頁將改為決賽名單（已勾選 ${d.advance.filter(x => x.advanced).length} 位晉級者），並重新開放評分。`
      : '切換回初賽？評審頁將改回初賽名單，並重新開放評分。';
    if (confirm(msg)) adminCall('adminStage', { stage: next }, '已切換到' + next);
  };
}

// 紙本代輸入：一位評審一張大表，照紙本一列一列打，最後一次儲存
const P = { judge: '', data: null, loading: false, err: '' };

async function loadPaper(judge) {
  P.loading = true; P.err = '';
  try { P.data = await api('adminSheet', { at: A.at, judge }); P.judge = P.data.judge; }
  catch (err) { P.err = err.message; }
  P.loading = false;
  if (A.tab === 'paper') drawAdmin();
}

function paperDirty() { return !!app.querySelector('tr.changed'); }

function drawAdminPaper(body) {
  if (!P.data && !P.loading) { loadPaper(P.judge); }
  if (!P.data) { body.innerHTML = P.err ? `<div class="banner err">${esc(P.err)}</div>` : '<p class="sub">載入中…</p>'; return; }
  const d = P.data, crit = d.criteria;
  const val = (sc, k) => sc && sc.items[k] !== '' && sc.items[k] != null ? esc(sc.items[k]) : '';
  body.innerHTML = `
    <div class="card">
      <div class="row" style="flex-wrap:wrap;gap:8px">
        <span class="small" style="font-weight:700">評審</span>
        ${d.judges.map(j => `<button class="${j === d.judge ? '' : 'ghost'}" data-judge="${esc(j)}" style="min-height:38px;padding:6px 14px;font-size:14px">${esc(j)}</button>`).join('')}
      </div>
      <p class="meta small" style="margin:10px 0 0">照紙本依序輸入：Tab 移到右邊一格，Enter 跳到下一位的同一欄。四項都填了才會儲存該列，改過的列會標成黃色。已存過的分數會先帶出來，可以直接修改。</p>
      ${d.scoringOpen ? '' : '<div class="banner err" style="margin:10px 0 0">評分已鎖定，請先到「賽程與開關」開放評分才能儲存。</div>'}
    </div>
    <div style="overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:16px">
      <table class="paper">
        <thead><tr><th>序</th><th class="who">參賽者</th>${crit.map(c => `<th>${esc(c.name.split('／')[0])}<br><span class="meta">/${c.max}</span></th>`).join('')}<th>總分</th><th class="cmt">評語</th></tr></thead>
        <tbody>${d.entries.map((e, i) => `
          <tr data-id="${esc(e.id)}">
            <td class="meta">${e.order !== '' ? esc(e.order) : i + 1}</td>
            <td class="who"><div class="name ellipsis">${esc(e.singers)}</div><div class="meta ellipsis">${esc(e.song || '曲目未定')}${e.score && e.score.source === '評審線上' ? '・線上已評' : ''}</div></td>
            ${crit.map((c, k) => `<td><input type="text" inputmode="decimal" data-k="${k}" value="${val(e.score, c.name)}" aria-label="${esc(e.singers)} ${esc(c.name)}"></td>`).join('')}
            <td class="tot">${e.score ? fmt(crit.reduce((s, c) => s + (Number(e.score.items[c.name]) || 0), 0)) : ''}</td>
            <td class="cmt"><input type="text" data-c value="${esc(e.score ? e.score.comment : '')}" aria-label="${esc(e.singers)} 評語"></td>
          </tr>`).join('')}</tbody>
      </table>
    </div>
    <div class="actionbar"><div class="in" style="max-width:980px">
      <div class="grow small" id="phint">尚未修改</div>
      <button class="gold" data-act id="psave">全部儲存</button>
    </div></div>
    <p class="msg" id="sm"></p>`;

  const rows = [...body.querySelectorAll('tbody tr')];
  // 上次儲存時沒填完的列，重畫後把輸入內容放回去，避免白打
  rows.forEach(tr => {
    const kept = P.keep && P.keep[tr.dataset.id];
    if (!kept) return;
    tr.querySelectorAll('[data-k]').forEach((inp, k) => { inp.value = kept.vals[k]; });
    tr.querySelector('[data-c]').value = kept.comment;
    tr.classList.add('changed');
  });
  P.keep = null;
  setTimeout(() => refreshHint());
  const parse = v => { v = String(v).trim(); return v === '' ? null : Number(v); };
  const checkCell = inp => {
    const c = crit[inp.dataset.k], v = parse(inp.value);
    const bad = v !== null && (isNaN(v) || v < 0 || v > c.max || Math.round(v * 2) !== v * 2);
    inp.classList.toggle('bad', bad);
    inp.title = bad ? `請填 0 到 ${c.max}，最小單位 0.5` : '';
    return !bad;
  };
  const refreshRow = tr => {
    const vals = [...tr.querySelectorAll('[data-k]')].map(i => parse(i.value));
    tr.querySelector('.tot').textContent = vals.every(v => v === null) ? '' : fmt(vals.reduce((s, v) => s + (Number(v) || 0), 0)) + (vals.some(v => v === null) ? '…' : '');
  };
  const refreshHint = () => {
    const n = body.querySelectorAll('tr.changed').length;
    $('#phint').textContent = n ? `${n} 列尚未儲存` : '尚未修改';
  };
  rows.forEach((tr, r) => tr.querySelectorAll('input').forEach(inp => {
    inp.onfocus = () => inp.select();
    inp.oninput = () => { tr.classList.add('changed'); if (inp.dataset.k !== undefined) checkCell(inp); refreshRow(tr); refreshHint(); };
    inp.onkeydown = ev => {
      if (ev.key !== 'Enter') return;
      ev.preventDefault();
      const next = rows[r + 1];
      if (next) next.querySelector(inp.dataset.k !== undefined ? `[data-k="${inp.dataset.k}"]` : '[data-c]').focus();
    };
  }));
  body.querySelectorAll('[data-judge]').forEach(b => b.onclick = () => {
    if (paperDirty() && !confirm('還有尚未儲存的分數，確定要切換評審嗎？')) return;
    P.data = null; P.judge = b.dataset.judge; drawAdmin();
  });

  $('#psave').onclick = async () => {
    const changed = rows.filter(tr => tr.classList.contains('changed'));
    if (!changed.length) { toast('沒有要儲存的變更'); return; }
    const out = [], incomplete = [];
    let bad = false;
    changed.forEach(tr => {
      const inputs = [...tr.querySelectorAll('[data-k]')];
      if (!inputs.every(checkCell)) bad = true;
      const vals = inputs.map(i => parse(i.value));
      if (vals.some(v => v === null)) { incomplete.push(tr); return; }
      out.push({ id: tr.dataset.id, items: Object.fromEntries(crit.map((c, k) => [c.name, vals[k]])), comment: tr.querySelector('[data-c]').value.trim() });
    });
    const sm = $('#sm');
    if (bad) { setMsg(sm, '有分數超出範圍（紅框），請修正後再儲存', 'err'); body.querySelector('input.bad').focus(); return; }
    if (incomplete.length && !confirm(`有 ${incomplete.length} 列四項沒填完，這幾列不會儲存。其餘 ${out.length} 列要先儲存嗎？`)) return;
    if (!out.length) return;
    $('#psave').disabled = true; setMsg(sm, `儲存 ${out.length} 列中…`);
    const keep = Object.fromEntries(incomplete.map(tr => [tr.dataset.id, {
      vals: [...tr.querySelectorAll('[data-k]')].map(i => i.value), comment: tr.querySelector('[data-c]').value }]));
    try {
      P.data = await api('adminBatch', { at: A.at, judge: d.judge, stage: d.stage, rows: out });
      P.keep = keep;
      drawAdmin();
      toast(`已儲存 ${P.data.saved} 列（${d.judge}）`);
    } catch (err) { setMsg(sm, err.message, 'err'); $('#psave').disabled = false; }
  };
}

// =================== 啟動 ===================

function homeRoute() {
  const h = location.hash;
  if (h === '#ranks') renderRanks();
  else if (h === '#me') renderMe();
  else if (h === '#rules') renderRules();
  else if (h === '#profile') renderProfileLogin();
  else if (h === '#final') renderProfileLogin(true);
  else if (h === '#register') renderRegister();
  else renderHome();
  window.scrollTo(0, 0);
}

(async () => {
  // 評審、主辦頁各自帶回需要的設定，不另外讀 config
  if (params.get('judge')) return startJudge(params.get('judge'));
  if (params.get('admin')) return startAdmin(params.get('admin'));
  try {
    cfg = await api('config');
  } catch (err) {
    app.innerHTML = `<h1>${TITLE}</h1><div class="banner err">系統暫時無法連線：${esc(err.message)}</div>`;
    return;
  }
  window.addEventListener('hashchange', homeRoute);
  homeRoute();
})();
</script>
